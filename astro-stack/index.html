<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Astro Stack</title>
<meta name="description" content="Astro Stack — a one-tap idle stacking game. Drop blocks, chain perfect combos, earn crystals, and upgrade your rig.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #070812;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let W = 0, H = 0, DPR = 1, CX = 0, UNIT = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    UNIT = Math.min(W, H);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Config ----------
  const BH = () => UNIT * 0.052;               // block height
  const PAD = () => W * 0.06;                  // horizontal travel margin
  const BASE_Y = () => H * 0.80;               // tower baseline on screen
  const PERFECT_PX = () => Math.max(6, UNIT * 0.014);

  // ---------- Idle economy ----------
  const MINER_RATE = 2;                        // crystals per minute per miner level
  const OFFLINE_CAP_MIN = 240;
  const UPGRADES = {
    wide:  { icon: "📐", name: "WIDE",  max: 5,  cost: l => Math.floor(40 * Math.pow(2.2, l)),  desc: l => `+${l * 5}% base width` },
    slow:  { icon: "🐢", name: "SLOW",  max: 5,  cost: l => Math.floor(60 * Math.pow(2.2, l)),  desc: l => `-${l * 6}% block speed` },
    gold:  { icon: "💎", name: "GOLD",  max: 10, cost: l => Math.floor(50 * Math.pow(2, l)),    desc: l => `crystals ×${(1 + 0.25 * l).toFixed(2)}` },
    miner: { icon: "⛏", name: "MINER", max: 8,  cost: l => Math.floor(80 * Math.pow(2.5, l)),  desc: l => `+${l * MINER_RATE}◆/min` }
  };
  const goldFactor = () => 1 + 0.25 * save.gold;

  // ---------- Save ----------
  let save = { best: 0, gems: 0, wide: 0, slow: 0, gold: 0, miner: 0, muted: false, last: Date.now() };
  let offlineEarned = 0, offlineToast = 0;
  try {
    const raw = localStorage.getItem("astrostack_save");
    if (raw) save = Object.assign(save, JSON.parse(raw));
  } catch (e) {}
  if (save.miner > 0 && save.last) {
    const mins = Math.min(Math.max(0, (Date.now() - save.last) / 60000), OFFLINE_CAP_MIN);
    offlineEarned = Math.floor(mins * MINER_RATE * save.miner);
    if (offlineEarned > 0) { save.gems += offlineEarned; offlineToast = 6; }
  }
  function persist() {
    save.last = Date.now();
    try { localStorage.setItem("astrostack_save", JSON.stringify(Object.assign({}, save, { gems: Math.floor(save.gems) }))); } catch (e) {}
  }
  persist();
  document.addEventListener("visibilitychange", () => { if (document.hidden) persist(); });
  setInterval(persist, 5000);

  // ---------- Sound ----------
  const AC = window.AudioContext || window.webkitAudioContext;
  let audio = null;
  function ensureAudio() {
    if (!AC) return;
    if (!audio) { try { audio = new AC(); } catch (e) { return; } }
    if (audio.state === "suspended") audio.resume();
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!audio || save.muted) return;
    const t = audio.currentTime;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function noiseBurst(dur, vol, filterFreq) {
    if (!audio || save.muted) return;
    const t = audio.currentTime;
    const len = Math.floor(audio.sampleRate * dur);
    const buf = audio.createBuffer(1, len, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audio.createBufferSource();
    src.buffer = buf;
    const f = audio.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(filterFreq || 900, t);
    f.frequency.exponentialRampToValueAtTime(120, t + dur);
    const g = audio.createGain();
    g.gain.setValueAtTime(vol || 0.3, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(audio.destination);
    src.start(t);
  }
  const sfx = {
    drop()        { tone(150, 0.1, "sawtooth", 0.12, 90); noiseBurst(0.06, 0.1, 600); },
    perfect(c)    { tone(660 + c * 60, 0.12, "triangle", 0.14, (660 + c * 60) * 1.5); },
    slice()       { noiseBurst(0.12, 0.14, 2400); },
    over()        { noiseBurst(0.45, 0.3, 600); tone(220, 0.5, "sawtooth", 0.15, 55); },
    best()        { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.18, "triangle", 0.14), i * 90)); },
    start()       { tone(440, 0.1, "triangle", 0.12, 880); },
    buy()         { tone(700, 0.07, "square", 0.08); setTimeout(() => tone(1050, 0.12, "square", 0.08), 70); },
    deny()        { tone(180, 0.15, "square", 0.08, 120); }
  };

  // ---------- State ----------
  const ST_MENU = 0, ST_PLAY = 1, ST_DEAD = 2;
  let state = ST_MENU;

  let blocks, mover, falling, particles, popups, stars;
  let height, combo, camOff, camTarget, shake, flash, deathT, runGems;
  let uiRects = {};

  function makeStars() {
    stars = [];
    const n = Math.floor((W * H) / 9000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.3,
        tw: Math.random() * Math.PI * 2,
        sp: 0.5 + Math.random() * 1.5
      });
    }
  }
  makeStars();
  window.addEventListener("resize", makeStars);

  function baseWidth() { return Math.min(W * 0.5 * (1 + 0.05 * save.wide), W * 0.8); }
  function moverSpeed() {
    return Math.min(480, (UNIT * 0.32 + height * UNIT * 0.011)) * (1 - 0.06 * save.slow);
  }

  function reset() {
    const bw = baseWidth();
    blocks = [{ x: CX - bw / 2, w: bw }];
    height = 1;
    combo = 0;
    camOff = 0;
    camTarget = 0;
    falling = [];
    particles = [];
    popups = [];
    shake = 0;
    flash = 0;
    deathT = 0;
    runGems = 0;
    spawnMover();
  }

  function spawnMover() {
    const top = blocks[blocks.length - 1];
    const fromLeft = height % 2 === 1;
    mover = {
      w: top.w,
      x: fromLeft ? PAD() : W - PAD() - top.w,
      dir: fromLeft ? 1 : -1
    };
  }
  reset();

  // ---------- Input ----------
  function inRect(x, y, r) { return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

  function handleTap(x, y) {
    ensureAudio();
    if (x != null && inRect(x, y, uiRects.mute)) {
      save.muted = !save.muted;
      persist();
      if (!save.muted) tone(660, 0.08, "sine", 0.1);
      return;
    }
    if (state !== ST_PLAY && x != null) {
      for (const key of Object.keys(UPGRADES)) {
        if (inRect(x, y, uiRects[key])) { tryBuy(key); return; }
      }
    }
    if (state === ST_MENU) {
      reset();
      state = ST_PLAY;
      sfx.start();
      return;
    }
    if (state === ST_PLAY) {
      dropBlock();
      return;
    }
    if (state === ST_DEAD && performance.now() - deathT > 600) {
      reset();
      state = ST_PLAY;
      sfx.start();
    }
  }
  window.addEventListener("pointerdown", e => { e.preventDefault(); handleTap(e.clientX, e.clientY); }, { passive: false });
  window.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter") { e.preventDefault(); handleTap(null, null); }
    if (e.code === "KeyM") { save.muted = !save.muted; persist(); }
  });

  function tryBuy(key) {
    const u = UPGRADES[key];
    const lvl = save[key];
    if (lvl >= u.max) { sfx.deny(); return; }
    const cost = u.cost(lvl);
    if (Math.floor(save.gems) >= cost) {
      save.gems -= cost;
      save[key]++;
      persist();
      sfx.buy();
      const r = uiRects[key];
      if (r) burst(r.x + r.w / 2, r.y, 14, "#7df9ff", 130);
    } else {
      sfx.deny();
      flash = Math.max(flash, 0.1);
    }
  }

  // ---------- Helpers ----------
  function burst(x, y, n, color, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = spd * (0.4 + Math.random() * 0.9);
      particles.push({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1, decay: 1.6 + Math.random() * 1.4,
        r: 1.5 + Math.random() * 2.5, color
      });
    }
  }
  function popup(x, y, text, color, big) {
    popups.push({ x, y, text, color, life: 1, big: !!big });
  }
  function hue(i) { return (i * 24) % 360; }
  function rowY(i) { return BASE_Y() - i * BH() + camOff; }

  // ---------- Core mechanic ----------
  function dropBlock() {
    const top = blocks[blocks.length - 1];
    const left = Math.max(mover.x, top.x);
    const right = Math.min(mover.x + mover.w, top.x + top.w);
    const overlap = right - left;
    const y = rowY(height);

    if (overlap <= 0) {
      // total miss — the block tumbles and the run ends
      falling.push({ x: mover.x, w: mover.w, y, vy: -60, vx: mover.dir * 80, rot: 0, vr: mover.dir * 2 });
      endRun();
      return;
    }

    const offset = Math.abs(mover.x - top.x);
    if (offset <= PERFECT_PX()) {
      // perfect drop: snap to the block below, keep full width
      combo++;
      blocks.push({ x: top.x, w: top.w });
      const bonus = Math.floor(5 * combo * goldFactor());
      runGems += bonus;
      save.gems += bonus;
      sfx.perfect(combo);
      popup(CX, y - BH(), `PERFECT ×${combo}  +${bonus}◆`, "#ffd166", true);
      burst(top.x + top.w / 2, y, 18, "#ffd166", 160);
      flash = 0.15;
    } else {
      // slice the overhang off
      combo = 0;
      blocks.push({ x: left, w: overlap });
      const cutX = mover.x < top.x ? mover.x : right;
      const cutW = mover.w - overlap;
      falling.push({ x: cutX, w: cutW, y, vy: -30, vx: (mover.x < top.x ? -1 : 1) * 60, rot: 0, vr: (mover.x < top.x ? -1 : 1) * 2.5 });
      const earn = Math.floor(1 * goldFactor());
      runGems += earn;
      save.gems += earn;
      sfx.drop();
      sfx.slice();
    }

    height++;
    camTarget = Math.max(0, (height - 6)) * BH();
    if (height - 1 > save.best) {
      save.best = height - 1;
    }
    persist();
    spawnMover();
  }

  function endRun() {
    state = ST_DEAD;
    deathT = performance.now();
    shake = 1;
    flash = 0.8;
    sfx.over();
    const finalScore = height - 1;
    if (finalScore >= save.best && finalScore > 0) setTimeout(() => sfx.best(), 500);
    persist();
  }

  // ---------- Update ----------
  function update(dt) {
    for (const s of stars) s.tw += s.sp * dt;
    if (save.miner > 0) save.gems += (MINER_RATE * save.miner / 60) * dt;
    offlineToast = Math.max(0, offlineToast - dt);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.98; p.vy *= 0.98;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 30 * dt;
      p.life -= (p.big ? 0.9 : 1.2) * dt;
      if (p.life <= 0) popups.splice(i, 1);
    }
    for (let i = falling.length - 1; i >= 0; i--) {
      const f = falling[i];
      f.vy += UNIT * 1.6 * dt;
      f.y += f.vy * dt;
      f.x += f.vx * dt;
      f.rot += f.vr * dt;
      if (f.y > H + BH() * 3) falling.splice(i, 1);
    }
    shake = Math.max(0, shake - dt * 3);
    flash = Math.max(0, flash - dt * 2.5);
    camOff += (camTarget - camOff) * Math.min(1, 8 * dt);

    if (state !== ST_PLAY) return;

    // moving block bounces between the margins
    mover.x += mover.dir * moverSpeed() * dt;
    if (mover.x <= PAD()) { mover.x = PAD(); mover.dir = 1; }
    if (mover.x + mover.w >= W - PAD()) { mover.x = W - PAD() - mover.w; mover.dir = -1; }
  }

  // ---------- Draw ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBlock(x, y, w, i, glow) {
    const h = BH();
    const hu = hue(i);
    ctx.save();
    if (glow) {
      ctx.shadowColor = `hsl(${hu}, 80%, 65%)`;
      ctx.shadowBlur = 16;
    }
    ctx.fillStyle = `hsl(${hu}, 62%, 52%)`;
    ctx.fillRect(x, y - h, w, h);
    ctx.fillStyle = `hsl(${hu}, 75%, 68%)`;
    ctx.fillRect(x, y - h, w, h * 0.22);
    ctx.strokeStyle = `hsla(${hu}, 90%, 80%, 0.5)`;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y - h + 0.5, w - 1, h - 1);
    ctx.restore();
  }

  function drawGems(x, y, size) {
    ctx.textAlign = "left";
    ctx.fillStyle = "#7df9ff";
    ctx.font = `700 ${Math.round(size)}px -apple-system, sans-serif`;
    ctx.fillText("◆ " + Math.floor(save.gems), x, y);
  }

  function drawShopCard(key, x, y, w, h) {
    const u = UPGRADES[key];
    const lvl = save[key];
    const maxed = lvl >= u.max;
    const cost = maxed ? 0 : u.cost(lvl);
    const afford = !maxed && Math.floor(save.gems) >= cost;

    uiRects[key] = { x, y, w, h };
    roundRect(x, y, w, h, 10);
    ctx.fillStyle = afford ? "rgba(30,45,85,0.88)" : "rgba(18,24,50,0.82)";
    ctx.fill();
    ctx.strokeStyle = afford ? "rgba(125,249,255,0.8)" : "rgba(125,249,255,0.18)";
    ctx.lineWidth = afford ? 2 : 1;
    ctx.stroke();

    const cxm = x + w / 2;
    ctx.textAlign = "center";
    ctx.font = `${Math.round(h * 0.26)}px -apple-system, sans-serif`;
    ctx.fillStyle = "#fff";
    ctx.fillText(u.icon, cxm, y + h * 0.30);
    ctx.font = `800 ${Math.round(h * 0.14)}px -apple-system, sans-serif`;
    ctx.fillText(`${u.name} ${lvl > 0 ? "Lv" + lvl : ""}`, cxm, y + h * 0.50);
    ctx.font = `600 ${Math.round(h * 0.115)}px -apple-system, sans-serif`;
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.fillText(maxed ? u.desc(lvl) : u.desc(lvl + 1), cxm, y + h * 0.66);
    ctx.font = `800 ${Math.round(h * 0.14)}px -apple-system, sans-serif`;
    ctx.fillStyle = maxed ? "#ffd166" : (afford ? "#7df9ff" : "rgba(125,249,255,0.4)");
    ctx.fillText(maxed ? "MAX" : "◆ " + cost, cxm, y + h * 0.86);
  }

  function shopTop() {
    const gap = UNIT * 0.016;
    const cw = Math.min((W - gap * 5) / 4, UNIT * 0.26);
    return H - cw * 0.88 - Math.max(16, H * 0.03);
  }

  function drawShop() {
    const gap = UNIT * 0.016;
    const keys = ["wide", "slow", "gold", "miner"];
    const n = keys.length;
    const cw = Math.min((W - gap * (n + 1)) / n, UNIT * 0.26);
    const chh = cw * 0.88;
    const total = cw * n + gap * (n - 1);
    const x0 = CX - total / 2;
    const y = shopTop();
    for (let i = 0; i < n; i++) drawShopCard(keys[i], x0 + i * (cw + gap), y, cw, chh);
  }

  function draw() {
    uiRects = {};
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);
    }

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#070812");
    g.addColorStop(0.6, "#101334");
    g.addColorStop(1, "#1a1040");
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    for (const s of stars) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(s.tw);
      ctx.fillStyle = "#cdd6ff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // launch pad under the tower
    const padY = rowY(0);
    ctx.fillStyle = "rgba(125,249,255,0.12)";
    roundRect(CX - baseWidth() * 0.75, padY, baseWidth() * 1.5, BH() * 0.5, 6);
    ctx.fill();
    ctx.strokeStyle = "rgba(125,249,255,0.4)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // tower
    const start = Math.max(0, height - 24);
    for (let i = start; i < blocks.length; i++) {
      drawBlock(blocks[i].x, rowY(i + 1), blocks[i].w, i, i === blocks.length - 1);
    }

    // falling slices
    for (const f of falling) {
      ctx.save();
      ctx.translate(f.x + f.w / 2, f.y - BH() / 2);
      ctx.rotate(f.rot);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "hsl(220, 30%, 40%)";
      ctx.fillRect(-f.w / 2, -BH() / 2, f.w, BH());
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // moving block
    if (state === ST_PLAY) {
      drawBlock(mover.x, rowY(height), mover.w, height, true);
      // alignment guides
      const top = blocks[blocks.length - 1];
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = "#7df9ff";
      ctx.setLineDash([3, 5]);
      ctx.beginPath();
      ctx.moveTo(top.x, rowY(height) + 2);
      ctx.lineTo(top.x, rowY(height - 1) - BH() - 2);
      ctx.moveTo(top.x + top.w, rowY(height) + 2);
      ctx.lineTo(top.x + top.w, rowY(height - 1) - BH() - 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // popups
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.font = `bold ${Math.round(UNIT * (p.big ? 0.034 : 0.028))}px -apple-system, sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    // ---- HUD ----
    const pad = Math.max(14, UNIT * 0.03);
    drawGems(pad, pad + UNIT * 0.02, UNIT * 0.030);
    const mb = { w: UNIT * 0.075, h: UNIT * 0.075 };
    uiRects.mute = { x: W - pad - mb.w, y: pad - mb.h * 0.25, w: mb.w, h: mb.h };
    ctx.textAlign = "right";
    ctx.font = `${Math.round(UNIT * 0.040)}px -apple-system, sans-serif`;
    ctx.globalAlpha = 0.85;
    ctx.fillText(save.muted ? "🔇" : "🔊", W - pad, pad + UNIT * 0.025);
    ctx.globalAlpha = 1;

    if (state === ST_PLAY) {
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.round(UNIT * 0.055)}px -apple-system, sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(String(height - 1), CX, UNIT * 0.09);
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.font = `600 ${Math.round(UNIT * 0.024)}px -apple-system, sans-serif`;
      const bits = [`BEST ${save.best}`];
      if (combo > 1) bits.push(`🔥 ×${combo}`);
      ctx.fillText(bits.join("   "), CX, UNIT * 0.125);
    }

    if (state === ST_MENU) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      ctx.font = `800 ${Math.round(UNIT * 0.075)}px -apple-system, sans-serif`;
      ctx.fillText("ASTRO STACK", CX, H * 0.18);
      ctx.fillStyle = "#7df9ff";
      ctx.font = `600 ${Math.round(UNIT * 0.028)}px -apple-system, sans-serif`;
      ctx.fillText("tap to drop · nail the perfect stack", CX, H * 0.18 + UNIT * 0.055);
      const tapY = Math.min(H * 0.60, shopTop() - UNIT * 0.03);
      if (save.best > 0) {
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.fillText(`BEST ${save.best}`, CX, tapY - UNIT * 0.065);
      }
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 350);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = "#ffffff";
      ctx.font = `700 ${Math.round(UNIT * 0.036)}px -apple-system, sans-serif`;
      ctx.fillText("TAP TO PLAY", CX, tapY);
      ctx.globalAlpha = 1;
      drawShop();

      if (offlineToast > 0 && offlineEarned > 0) {
        ctx.globalAlpha = Math.min(1, offlineToast);
        roundRect(CX - UNIT * 0.28, UNIT * 0.14, UNIT * 0.56, UNIT * 0.085, 10);
        ctx.fillStyle = "rgba(125,249,255,0.10)";
        ctx.fill();
        ctx.strokeStyle = "rgba(125,249,255,0.7)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = "#7df9ff";
        ctx.textAlign = "center";
        ctx.font = `700 ${Math.round(UNIT * 0.026)}px -apple-system, sans-serif`;
        ctx.fillText(`while you were away: +${offlineEarned} ◆`, CX, UNIT * 0.14 + UNIT * 0.053);
        ctx.globalAlpha = 1;
      }
    }

    if (state === ST_DEAD) {
      ctx.fillStyle = "rgba(7,8,18,0.55)";
      ctx.fillRect(-20, -20, W + 40, H + 40);
      drawGems(pad, pad + UNIT * 0.02, UNIT * 0.030);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff5470";
      ctx.font = `800 ${Math.round(UNIT * 0.06)}px -apple-system, sans-serif`;
      ctx.fillText("TOWER DOWN", CX, H * 0.28);
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.round(UNIT * 0.075)}px -apple-system, sans-serif`;
      ctx.fillText(String(height - 1), CX, H * 0.28 + UNIT * 0.09);
      const isBest = height - 1 >= save.best && save.best > 0;
      ctx.fillStyle = isBest ? "#ffd166" : "rgba(255,255,255,0.6)";
      ctx.font = `600 ${Math.round(UNIT * 0.028)}px -apple-system, sans-serif`;
      ctx.fillText(isBest ? "★ NEW BEST ★" : `BEST ${save.best}`, CX, H * 0.28 + UNIT * 0.135);
      ctx.fillStyle = "#7df9ff";
      ctx.font = `700 ${Math.round(UNIT * 0.032)}px -apple-system, sans-serif`;
      ctx.fillText(`+${runGems} ◆ earned`, CX, H * 0.28 + UNIT * 0.19);
      if (performance.now() - deathT > 600) {
        const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 350);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = "#ffffff";
        ctx.font = `700 ${Math.round(UNIT * 0.032)}px -apple-system, sans-serif`;
        ctx.fillText("TAP TO RETRY", CX, H * 0.28 + UNIT * 0.25);
        ctx.globalAlpha = 1;
      }
      drawShop();
    }

    if (flash > 0) {
      ctx.globalAlpha = flash * 0.25;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-20, -20, W + 40, H + 40);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  // read-only state snapshot for automated testing
  window.__stackDebug = () => ({
    state, height: height - 1, combo,
    moverX: Math.round(mover.x), moverW: Math.round(mover.w), moverDir: mover.dir,
    topX: Math.round(blocks[blocks.length - 1].x), topW: Math.round(blocks[blocks.length - 1].w),
    gems: Math.floor(save.gems), best: save.best
  });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
  }
  if (new URLSearchParams(location.search).has("test")) {
    // test mode: keep simulating even when the tab is hidden. Hidden tabs
    // throttle timers, so each tick runs enough fixed steps to cover the
    // real elapsed time instead of relying on tick frequency.
    let tLast = performance.now();
    setInterval(() => {
      const now = performance.now();
      let steps = Math.min(Math.round((now - tLast) / (1000 / 60)), 300);
      tLast = now;
      while (steps-- > 0) update(1 / 60);
      draw();
    }, 16);
  } else {
    const loop = now => { frame(now); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
