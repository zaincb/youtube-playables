<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zain's Playables</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #060714;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 560px; width: 100%; }
  h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
  .sub { color: rgba(255,255,255,0.55); margin-bottom: 28px; font-size: 15px; }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: linear-gradient(135deg, #16183a, #0d0f26);
    border: 1px solid rgba(125,249,255,0.25);
    border-radius: 14px;
    padding: 20px 22px;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover { transform: translateY(-2px); border-color: rgba(125,249,255,0.6); }
  .card h2 { font-size: 20px; font-weight: 700; color: #7df9ff; margin-bottom: 6px; }
  .card p { color: rgba(255,255,255,0.7); font-size: 14px; line-height: 1.5; }
  .tag { display: inline-block; margin-top: 12px; font-size: 12px; font-weight: 600; color: #ffd166; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Zain's Playables</h1>
    <p class="sub">Instant-play HTML5 games. No downloads, no installs — tap and play.</p>
    <a class="card" href="orbit-dash/">
      <h2>Orbit Dash ▸</h2>
      <p>A one-tap arcade game. Leap between orbit rings and dodge asteroids in fast, score-chasing runs. Touch &amp; keyboard friendly.</p>
      <span class="tag">PLAY NOW</span>
    </a>
  </div>
</body>
</html>
